name: Platform CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  validate-infrastructure:
    name: Validate Docker Compose & Configurations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy .env.example to .env
        run: cp .env.example .env

      - name: Validate Docker Compose (Core Profile)
        run: docker compose --profile core config

      - name: Validate Docker Compose (Full Profile)
        run: docker compose --profile full config

      - name: Validate OpenTelemetry Collector Config Syntax
        run: |
          if command -v yamllint &> /dev/null; then
            yamllint infra/observability/otel-collector-config.yaml
          else
            python3 -c "import yaml; yaml.safe_load(open('infra/observability/otel-collector-config.yaml'))"
          fi

      - name: Check for committed secrets (.env hygiene)
        run: |
          if [ -f .env ] && grep -E "(BEGIN (RSA |EC )?PRIVATE KEY|AKIA[0-9A-Z]{16})" .env; then
            echo "::error::Private keys or cloud API tokens detected in repository files!"
            exit 1
          fi

  validate-code-scaffolding:
    name: Validate Scaffolding & Skeletons
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python Syntax
        run: |
          python3 -m compileall ai-plane/

      - name: Validate Flyway SQL Syntax
        run: |
          for f in backend/ticket-service/src/main/resources/db/migration/*.sql; do
            echo "Checking $f..."
            test -s "$f" || (echo "$f is empty" && exit 1)
          done

