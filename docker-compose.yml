# ==============================================================================
# Enterprise AI Platform — Docker Compose Multi-Profile Specification
# Source of truth: ENTERPRISE_AI_PLATFORM_BLUEPRINT.md (Section 16.1 & 18)
# Profiles:
#   - core  : Postgres 16, Redis 7, Kafka KRaft (Single-node)
#   - ai    : AI plane, Qdrant, Ollama (Phase 5+)
#   - obs   : OTel Collector, Prometheus, Grafana (Phase 1/Observability)
#   - tools : Kafka UI, Flyway runner (Development tools)
#   - full  : All services
# ==============================================================================

name: enterprise-ai-platform

networks:
  app-network:
    name: enterprise-ai-network
    driver: bridge

volumes:
  postgres_data:
    name: enterprise-ai-postgres-data
  redis_data:
    name: enterprise-ai-redis-data
  kafka_data:
    name: enterprise-ai-kafka-data
  minio_data:
    name: enterprise-ai-minio-data
  qdrant_data:
    name: enterprise-ai-qdrant-data

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 (Multi-tenant with separate service databases)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: enterprise-ai-postgres
    restart: unless-stopped
    profiles: ["core", "full"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/01-init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEM_LIMIT:-512m}
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # Redis 7 (Caching, rate-limiting, short-term memory)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: enterprise-ai-redis
    restart: unless-stopped
    profiles: ["core", "full"]
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_dev_password}
      --maxmemory 128mb
      --maxmemory-policy volatile-lru
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-256m}
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # Apache Kafka (KRaft mode: Controller + Broker combined, No ZooKeeper)
  # ----------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: enterprise-ai-kafka
    restart: unless-stopped
    profiles: ["core", "full"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:29092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'INTERNAL'
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L622nShTUiTwyMVZxwJxA}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_JVM_PERFORMANCE_OPTS: ${KAFKA_JVM_PERFORMANCE_OPTS:--Xmx512m -Xms256m}
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${KAFKA_MEM_LIMIT:-1024m}
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # Keycloak (Identity & OIDC Authentication Provider)
  # ----------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: enterprise-ai-keycloak
    restart: unless-stopped
    profiles: ["core", "full"]
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_password}
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-Xms256m -Xmx384m"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768m
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # Ticket Service (Phase 3 — Core Ticketing)
  # ----------------------------------------------------------------------------
  ticket-service:
    build:
      context: ./backend
      dockerfile: ticket-service/Dockerfile
    container_name: enterprise-ai-ticket-service
    restart: unless-stopped
    profiles: ["core", "full"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ticket_db?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USER:-app_user}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-app_user_password}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_TRACING_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m -XX:+UseG1GC -XX:+UseContainerSupport"
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "${TICKET_SERVICE_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384m
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # OpenTelemetry Collector (Trace and metrics ingestion)
  # ----------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: enterprise-ai-otel-collector
    restart: unless-stopped
    profiles: ["obs", "full"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # OTel internal metrics
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # MinIO / S3 Object Storage for Knowledge Documents
  # ----------------------------------------------------------------------------
  minio:
    image: adobe/s3mock:latest
    container_name: enterprise-ai-minio
    restart: unless-stopped
    profiles: ["core", "ai", "full"]
    environment:
      initialBuckets: enterprise-ai-knowledge
    ports:
      - "${MINIO_PORT:-9000}:9090"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9090 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # Qdrant (Vector Database for RAG Semantic Embeddings)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise-ai-qdrant
    restart: unless-stopped
    profiles: ["core", "ai", "full"]
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384m
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # Knowledge Service (Document Ingestion, MinIO & Qdrant Hybrid RAG)
  # ----------------------------------------------------------------------------
  knowledge-service:
    build:
      context: ./backend
      dockerfile: knowledge-service/Dockerfile
    container_name: enterprise-ai-knowledge-service
    restart: unless-stopped
    profiles: ["core", "ai", "full"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/knowledge_db?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USER:-app_user}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-app_user_password}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MINIO_ENDPOINT: http://minio:9090
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_dev_password}
      MINIO_BUCKET: enterprise-ai-knowledge
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      MANAGEMENT_TRACING_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m -XX:+UseG1GC -XX:+UseContainerSupport"
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "${KNOWLEDGE_SERVICE_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384m
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # Workflow Service (Human Approvals, Rejections & State Transitions)
  # ----------------------------------------------------------------------------
  workflow-service:
    build:
      context: ./backend
      dockerfile: workflow-service/Dockerfile
    container_name: enterprise-ai-workflow-service
    restart: unless-stopped
    profiles: ["core", "ai", "full"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/workflow_db?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USER:-app_user}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD:-app_user_password}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_TRACING_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m -XX:+UseG1GC -XX:+UseContainerSupport"
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "${WORKFLOW_SERVICE_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384m
    networks:
      - app-network

  # ----------------------------------------------------------------------------
  # Flyway Migration Tool (Repeatable schema migrations)
  # ----------------------------------------------------------------------------
  flyway:
    image: flyway/flyway:10-alpine
    container_name: enterprise-ai-flyway
    profiles: ["tools", "core", "full"]
    volumes:
      - ./backend:/flyway/backend:ro
      - ./infra/docker/flyway/flyway.conf:/flyway/conf/flyway.conf:ro
    networks:
      - app-network

