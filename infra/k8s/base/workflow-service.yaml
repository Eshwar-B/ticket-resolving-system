apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-service
  namespace: enterprise-ai
  labels:
    app: workflow-service
    app.kubernetes.io/name: workflow-service
    app.kubernetes.io/part-of: enterprise-ai-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: workflow-service
  template:
    metadata:
      labels:
        app: workflow-service
        app.kubernetes.io/name: workflow-service
        app.kubernetes.io/part-of: enterprise-ai-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: workflow-service
          image: enterprise-ai/workflow-service:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres.enterprise-ai.svc.cluster.local:5432/workflow_db?stringtype=unspecified"
          ports:
            - containerPort: 8083
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-service
  namespace: enterprise-ai
  labels:
    app: workflow-service
    app.kubernetes.io/part-of: enterprise-ai-platform
spec:
  type: ClusterIP
  selector:
    app: workflow-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
