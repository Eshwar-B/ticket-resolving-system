apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: enterprise-ai
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-service-traffic
  namespace: enterprise-ai
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: enterprise-ai-platform
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: enterprise-ai-platform
        - namespaceSelector:
            matchLabels:
              name: enterprise-ai
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: enterprise-ai-platform
        - namespaceSelector:
            matchLabels:
              name: enterprise-ai
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
