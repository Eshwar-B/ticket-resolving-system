apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-plane
  namespace: enterprise-ai
  labels:
    app: ai-plane
    app.kubernetes.io/name: ai-plane
    app.kubernetes.io/part-of: enterprise-ai-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: ai-plane
  template:
    metadata:
      labels:
        app: ai-plane
        app.kubernetes.io/name: ai-plane
        app.kubernetes.io/part-of: enterprise-ai-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: ai-plane
          image: enterprise-ai/ai-plane:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          env:
            - name: AI_ADAPTER_TYPE
              value: "mock"
            - name: OLLAMA_HOST
              value: "http://ollama.enterprise-ai.svc.cluster.local:11434"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "150m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-plane
  namespace: enterprise-ai
  labels:
    app: ai-plane
    app.kubernetes.io/part-of: enterprise-ai-platform
spec:
  type: ClusterIP
  selector:
    app: ai-plane
  ports:
    - name: http
      port: 8000
      targetPort: 8000
