apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  namespace: enterprise-ai
  labels:
    app: ticket-service
    app.kubernetes.io/name: ticket-service
    app.kubernetes.io/part-of: enterprise-ai-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
        app.kubernetes.io/name: ticket-service
        app.kubernetes.io/part-of: enterprise-ai-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: ticket-service
          image: enterprise-ai/ticket-service:0.1.0-SNAPSHOT
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres.enterprise-ai.svc.cluster.local:5432/ticket_db?stringtype=unspecified"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.enterprise-ai.svc.cluster.local:9092"
          ports:
            - containerPort: 8081
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-service
  namespace: enterprise-ai
  labels:
    app: ticket-service
    app.kubernetes.io/part-of: enterprise-ai-platform
spec:
  type: ClusterIP
  selector:
    app: ticket-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
