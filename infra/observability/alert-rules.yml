# ==============================================================================
# Enterprise AI Platform: Prometheus Operational Alert Rules
# Blueprint Section 14: Automated Anomaly & Incident Detection
# ==============================================================================

groups:
  - name: enterprise_ai_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[2m]) / rate(http_server_requests_seconds_count[2m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service HTTP 5xx error rate exceeds 5%"
          description: "Microservice {{ $labels.instance }} has an elevated error rate (> 5%) over the last 2 minutes."

      - alert: HighP95Latency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 2.0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "p95 API Latency exceeds 2 seconds"
          description: "Elevated p95 latency detected across service endpoints: {{ $value }}s."

      - alert: KafkaConsumerLagSpike
        expr: kafka_consumergroup_lag > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag backlog accumulating"
          description: "Consumer group {{ $labels.consumergroup }} lag on topic {{ $labels.topic }} is {{ $value }} messages."

      - alert: DeadLetterQueueMessageSpike
        expr: rate(kafka_topic_records_in_total{topic=~".*\\.dlq"}[1m]) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Poison message routed to Dead Letter Queue (DLQ)"
          description: "Messages routed to dead letter queue {{ $labels.topic }}. Investigate payload immediately."

      - alert: DatabaseConnectionPoolNearExhaustion
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.80
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HikariCP database pool active connections > 80%"
          description: "Pool {{ $labels.pool }} on {{ $labels.instance }} near saturation. Risk of connection starvation."

      - alert: TenantIsolationViolationDetected
        expr: increase(security_tenant_rejections_total[1m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Cross-Tenant Access or RLS Policy Rejection Triggered"
          description: "Unauthorized cross-tenant operation intercepted by security enforcer. Potential breach attempt."
